name: Update search indexes

on:
  schedule:
    - cron: "23 3 * * 1"
    - cron: "23 4 1 * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Search-index update scope
        required: true
        default: weekly
        type: choice
        options:
          - weekly
          - monthly
          - gnu
          - all

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: search-index-update
  cancel-in-progress: false

jobs:
  update:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and verify indexes
        env:
          MANUAL_SCOPE: ${{ inputs.scope }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            scope="$MANUAL_SCOPE"
          elif [ "$SCHEDULE_EXPRESSION" = "23 4 1 * *" ]; then
            scope="monthly"
          else
            scope="weekly"
          fi

          case "$scope" in
            weekly|monthly)
              selection=(--frequency "$scope")
              ;;
            gnu)
              selection=(--source gfortran --source gnu-objc)
              ;;
            all)
              selection=()
              ;;
            *)
              echo "Unsupported update scope: $scope"
              exit 2
              ;;
          esac

          node scripts/generate-search-index.mjs --update "${selection[@]}"
          node scripts/verify-live-search-index.mjs "${selection[@]}"
          npm run test:integration
          echo "UPDATE_SCOPE=$scope" >> "$GITHUB_ENV"
          echo "UPDATE_BRANCH=automation/search-index-update-$scope" >> "$GITHUB_ENV"

      - name: Ensure only generated indexes changed
        run: |
          unexpected="$(git status --porcelain --untracked-files=all | awk '$2 !~ /^public\\/search-index\\// { print }')"
          test -z "$unexpected" || {
            echo "$unexpected"
            exit 1
          }

      - name: Publish a draft update pull request
        run: |
          if git diff --quiet -- public/search-index; then
            echo "Search indexes are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$UPDATE_BRANCH"
          git add public/search-index
          git commit -m "Update generated search indexes"
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"
          gh pr view "$UPDATE_BRANCH" >/dev/null 2>&1 ||
            gh pr create \
              --draft \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$UPDATE_BRANCH" \
              --title "Update ${UPDATE_SCOPE} search indexes" \
              --body "Automated ${UPDATE_SCOPE} index refresh. Review source, count, size, and known-query changes before merging."
