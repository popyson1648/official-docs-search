[meta]
version = 1

[[languages]]
id = "python"
name = "Python"
aliases = ["py"]
bare_aliases = ["python"]

[[languages.sources]]
id = "python-docs"
kind = "official"
name = "Python Documentation"
url = "https://docs.python.org/"
domains = ["docs.python.org"]
default_enabled = true
locales = ["en", "ja"]

